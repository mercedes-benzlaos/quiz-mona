<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#a7cf45" />
  <title>XPENG Laos</title>
  <link rel="icon" type="image/png" href="XPENG-Logo.svg">
  <style>
    :root { color-scheme: light; --xpeng-green: #a7cf45; --page-bg: #f4f5f3; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; padding: 0; background: var(--page-bg); color: #111; font-family: Arial, Helvetica, sans-serif; }
    .page { width: min(100%, 1100px); margin: 0 auto; background: #fff; box-shadow: 0 3px 24px rgba(0,0,0,.08); }
    .image-wrap { width: 100%; overflow: hidden; background: #fff; line-height: 0; }
    .price-list { display: block; width: 100%; height: auto; cursor: zoom-in; object-fit: contain; }
      .whatsapp-link { padding: 12px 14px; }
      .whatsapp-link strong { font-size: 14px; }
    }

    .footer { padding: 14px 18px; background: #fff; border-top: 1px solid #ddd; text-align: center; font-size: 13px; line-height: 1.6; color: #333; }

    .footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .footer a:hover {
      color: #168b50;
    }

    .footer strong { color: #111; }
    .zoom-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(0,0,0,.88); z-index: 10; cursor: zoom-out; }
    .zoom-overlay.open { display: flex; }
    .zoom-overlay img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; background: #fff; }
    .close-hint { position: fixed; top: 12px; right: 16px; color: #fff; font-size: 14px; line-height: 1.4; } }
    @media print { body { background: #fff; } .page { width: 100%; box-shadow: none; } .footer { display: none; } .price-list { cursor: auto; } }
  
/* Premium XPENG Laos footer */
.xpeng-footer {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 78% 18%, rgba(0,0,0,.28), transparent 100%),
        radial-gradient(ellipse at 78% 18%, rgba(0,0,0,.28), transparent 100%),
        linear-gradient(115deg, #11161c 0%, #171d24 53%, #090d12 100%);
      padding: 48px max(18px, calc((100vw - 1100px) / 2)) 28px;
    }
    .xpeng-footer::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0 0 22% 35%;
      opacity: .42;
      background:
        linear-gradient(150deg, transparent 35%, rgba(0,0,0,.28) 35.2%, transparent 36.2%),
        linear-gradient(165deg, transparent 48%, rgba(0,0,0,.28) 48.2%, transparent 49%),
        linear-gradient(174deg, transparent 61%, rgba(0,0,0,.28) 61.2%, transparent 62%),
        linear-gradient(180deg, transparent, rgba(0,0,0,.5));
      clip-path: polygon(0 45%, 12% 38%, 25% 48%, 40% 30%, 51% 42%, 67% 17%, 79% 34%, 100% 8%, 100% 100%, 0 100%);
    }
    .xpeng-footer > .footer-main, .xpeng-footer > .footer-bottom { max-width: 1100px; margin-left: auto; margin-right: auto; }\n.footer-main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 54px;
      align-items: center;
      padding-bottom: 56px;
    }
    .brand-block { padding-right: 38px; border-right: 1px solid var(--line); }
    .brand-name {
      margin: 0;
      font-size: clamp(30px, 3.4vw, 44px);
      letter-spacing: .07em;
      font-weight: 600;
    }
    .accent-line { width: 36px; height: 4px; background: var(--accent); margin: 22px 0 20px; }
    .tagline { margin: 0 0 12px; font-size: 17px; color: #0a0a0a; }
    .lao-tagline { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .social-link {
      color: #f1f3f6;
      text-decoration: none;
      transition: color .2s ease, opacity .2s ease;
    }
    .social-link:hover { color: var(--accent); }
    .footer-bottom { border-top: 1px solid var(--line); padding-top: 28px; text-align: center; }
    .social-row { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 24px; }
    .social-link { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; }
    .social-icon {
      display: inline-grid; place-items: center; width: 32px; height: 32px;
      border: 1px solid rgba(255,255,255,.6); border-radius: 50%; font-weight: 700; font-size: 17px;
    }
    .social-link.whatsapp .social-icon { font-size: 15px; }
    .separator { width: 1px; height: 24px; background: var(--line); }
    .copyright { margin: 24px 0 0; color: #030303; font-size: 12px; letter-spacing: .02em; }
    @media (max-width: 760px) {
      .xpeng-footer { padding: 48px 24px 24px; }
      .xpeng-footer > .footer-main, .xpeng-footer > .footer-bottom { max-width: 1100px; margin-left: auto; margin-right: auto; }\n.footer-main { grid-template-columns: 1fr; gap: 28px; padding-bottom: 34px; }
      .brand-block { padding: 0 0 28px; border-right: 0; border-bottom: 1px solid var(--line); }
      .footer-nav { justify-content: flex-start; gap: 12px 26px; }
.social-row { gap: 16px; }
      .separator { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
.original-contact-position { width: min(100%, 1100px); margin: 0 auto; }\n.original-contact-position .social-row { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:24px; }\n.original-contact-position .social-link:link, .original-contact-position .social-link:visited { color:#000 !important; text-decoration:underline; transition: color .2s ease; }
.original-contact-position .social-link:hover, .original-contact-position .social-link:focus-visible, .original-contact-position .social-link:active { color:#168b50 !important; }\n.original-contact-position .social-icon { border-color:#555; }\n.original-contact-position .separator { background:#bbb; }\n@media (max-width:760px) { .original-contact-position { width: min(100%, 1100px); margin: 0 auto; }\n.original-contact-position .social-row { gap:16px; } .original-contact-position .separator { display:none; } }\n</style>
</head>
<body>
  <main class="page">
    <section class="image-wrap" aria-label="XPENG Laos vehicle models, colors, pricing and range">
      <img class="price-list" id="priceList" src="XPENG-LAOS.png"
    </section>
  </main>

  <div class="original-contact-position" style="background:#fff; color:#222; text-align:center; padding:14px 18px; border-top:1px solid #ddd; font-size:13px; line-height:1.6;">
    <div class="social-row">
        <a class="social-link" href="https://www.facebook.com/p/XPENG-Laos-61556746001180/" target="_blank" rel="noopener noreferrer">
          <span class="social-icon" aria-hidden="true">f</span>
          <span>XPENG Laos</span>
        </a>
        <span class="separator" aria-hidden="true"></span>
        <a class="social-link whatsapp" href="https://wa.me/8562059977422" target="_blank" rel="noopener noreferrer">
          <span class="social-icon" aria-hidden="true">📱</span>
          <span>Contact</span>
        </a>
      </div>
  </div>

  <div class="zoom-overlay" id="zoomOverlay" role="dialog" aria-modal="true" aria-label="Enlarged XPENG price list">
    <span class="close-hint">Click anywhere or press Esc to close</span>
    <img id="zoomImage" alt="Enlarged XPENG Laos model and pricing chart" />
  </div>
  <script>
    const priceList = document.getElementById('priceList');
    const overlay = document.getElementById('zoomOverlay');
    const zoomImage = document.getElementById('zoomImage');
    priceList.addEventListener('click', () => {
      zoomImage.src = priceList.src;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
    function closeZoom() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }
    overlay.addEventListener('click', closeZoom);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeZoom();
    });
  </script>
</body>
</html>
